<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students - College Event Registration System</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 22px 50px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 94%;
            max-width: 1250px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar h2 {
            color: #1f4e79;
        }

        .back-btn {
            background: #555;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            overflow-x: auto;
        }

        .card h3 {
            color: #1f4e79;
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .add-btn {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #1f4e79;
            color: white;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #1f4e79;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f8fc;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        #message {
            margin-top: 15px;
            padding: 10px;
            display: none;
            border-radius: 6px;
        }

        #formTitle {
            margin-bottom: 20px;
        }

        #cancelEdit {
            display: none;
            margin-left: 10px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #777;
            color: white;
            cursor: pointer;
        }

    </style>

</head>


<body>

<header>
    <h1>College Event Registration System</h1>
</header>


<div class="container">


    <div class="top-bar">

        <h2>Student Management</h2>

        <a href="/" class="back-btn">
            ← Dashboard
        </a>

    </div>


    <!-- ADD / EDIT FORM -->

    <div class="card">

        <h3 id="formTitle">
            Add New Student
        </h3>


        <form id="studentForm">

            <div class="form-grid">

                <input
                        type="text"
                        id="registerNumber"
                        placeholder="Register Number"
                        required
                >

                <input
                        type="text"
                        id="name"
                        placeholder="Student Name"
                        required
                >

                <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        required
                >

                <input
                        type="text"
                        id="department"
                        placeholder="Department"
                        required
                >

                <input
                        type="number"
                        id="year"
                        placeholder="Year"
                        min="1"
                        max="5"
                        required
                >

            </div>


            <button
                    type="submit"
                    class="add-btn"
                    id="submitBtn">

                Add Student

            </button>


            <button
                    type="button"
                    id="cancelEdit"
                    onclick="cancelEdit()">

                Cancel

            </button>

        </form>


        <div id="message"></div>

    </div>


    <!-- STUDENT LIST -->

    <div class="card">

        <h3>
            Student List
        </h3>


        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Register Number</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Year</th>
                <th>Actions</th>

            </tr>

            </thead>


            <tbody id="studentBody">

            </tbody>

        </table>

    </div>

</div>


<script>


    let editingStudentId = null;



    async function loadStudents() {

        const body =
            document.getElementById(
                "studentBody"
            );


        try {

            const response =
                await fetch(
                    "/api/students"
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load students"
                );

            }


            const students =
                await response.json();


            body.innerHTML = "";


            students.forEach(student => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${student.id ?? ""}
                    </td>

                    <td>
                        ${student.registerNumber ?? ""}
                    </td>

                    <td>
                        ${student.name ?? ""}
                    </td>

                    <td>
                        ${student.email ?? ""}
                    </td>

                    <td>
                        ${student.department ?? ""}
                    </td>

                    <td>
                        ${student.year ?? ""}
                    </td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick='editStudent(${JSON.stringify(student)})'>

                            Edit

                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${student.id})">

                            Delete

                        </button>

                    </td>

                `;


                body.appendChild(row);

            });


        } catch (error) {

            console.error(error);

        }

    }



    function editStudent(student) {

        editingStudentId =
            student.id;


        document.getElementById(
            "formTitle"
        ).innerText =
            "Edit Student";


        document.getElementById(
            "submitBtn"
        ).innerText =
            "Update Student";


        document.getElementById(
            "cancelEdit"
        ).style.display =
            "inline-block";


        document.getElementById(
            "registerNumber"
        ).value =
            student.registerNumber ?? "";


        document.getElementById(
            "name"
        ).value =
            student.name ?? "";


        document.getElementById(
            "email"
        ).value =
            student.email ?? "";


        document.getElementById(
            "department"
        ).value =
            student.department ?? "";


        document.getElementById(
            "year"
        ).value =
            student.year ?? "";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }



    function cancelEdit() {

        editingStudentId =
            null;


        document.getElementById(
            "studentForm"
        ).reset();


        document.getElementById(
            "formTitle"
        ).innerText =
            "Add New Student";


        document.getElementById(
            "submitBtn"
        ).innerText =
            "Add Student";


        document.getElementById(
            "cancelEdit"
        ).style.display =
            "none";

    }



    async function deleteStudent(id) {

        if (
            !confirm(
                "Are you sure you want to delete this student?"
            )
        ) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/students/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const text =
                    await response.text();

                throw new Error(
                    text ||
                    "Unable to delete student"
                );

            }


            showMessage(
                "Student deleted successfully!",
                true
            );


            loadStudents();


        } catch (error) {

            showMessage(
                error.message,
                false
            );

        }

    }



    document
        .getElementById(
            "studentForm"
        )
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const student = {

                    registerNumber:
                        document.getElementById(
                            "registerNumber"
                        ).value,

                    name:
                        document.getElementById(
                            "name"
                        ).value,

                    email:
                        document.getElementById(
                            "email"
                        ).value,

                    department:
                        document.getElementById(
                            "department"
                        ).value,

                    year:
                        Number(
                            document.getElementById(
                                "year"
                            ).value
                        )

                };


                try {

                    let response;


                    if (
                        editingStudentId === null
                    ) {

                        // CREATE

                        response =
                            await fetch(
                                "/api/students",
                                {

                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            student
                                        )

                                }
                            );


                    } else {

                        // UPDATE

                        response =
                            await fetch(
                                `/api/students/${editingStudentId}`,
                                {

                                    method: "PUT",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            student
                                        )

                                }
                            );

                    }


                    const text =
                        await response.text();


                    if (!response.ok) {

                        throw new Error(
                            text ||
                            "Operation failed"
                        );

                    }


                    if (
                        editingStudentId === null
                    ) {

                        showMessage(
                            "Student added successfully!",
                            true
                        );

                    } else {

                        showMessage(
                            "Student updated successfully!",
                            true
                        );

                    }


                    cancelEdit();

                    loadStudents();


                } catch (error) {

                    showMessage(
                        error.message,
                        false
                    );

                }

            }
        );



    function showMessage(
        text,
        success
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.style.display =
            "block";


        if (success) {

            message.style.background =
                "#e8f5e9";

            message.style.color =
                "#2e7d32";

        } else {

            message.style.background =
                "#ffebee";

            message.style.color =
                "#c62828";

        }


        message.innerText =
            text;

    }



    loadStudents();

</script>

</body>

</html>
