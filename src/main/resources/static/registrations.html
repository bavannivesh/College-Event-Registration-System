<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrations - College Event Registration System</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 22px 50px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar h2 {
            color: #1f4e79;
        }

        .back-btn {
            background: #555;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h3 {
            color: #1f4e79;
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
        }

        .register-btn {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #1f4e79;
            color: white;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #163a5c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1f4e79;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f8fc;
        }

        .registered {
            color: #2e7d32;
            font-weight: bold;
        }

        .cancelled {
            color: #c62828;
            font-weight: bold;
        }

        .cancel-btn {
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            background: #c62828;
            color: white;
            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #9b1c1c;
        }

        #message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #777;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: 95%;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>College Event Registration System</h1>

</header>


<div class="container">

    <div class="top-bar">

        <h2>Registration Management</h2>

        <a href="/" class="back-btn">
            ← Dashboard
        </a>

    </div>


    <!-- REGISTRATION FORM -->

    <div class="card">

        <h3>Register Student for Event</h3>

        <form id="registrationForm">

            <div class="form-grid">

                <div>

                    <label>
                        Select Student
                    </label>

                    <select id="studentId" required>

                        <option value="">
                            Loading students...
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Select Event
                    </label>

                    <select id="eventId" required>

                        <option value="">
                            Loading events...
                        </option>

                    </select>

                </div>

            </div>


            <button
                    type="submit"
                    class="register-btn">

                Register Student

            </button>

        </form>


        <div id="message"></div>

    </div>


    <!-- REGISTRATION LIST -->

    <div class="card">

        <h3>Registration List</h3>

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Student</th>
                <th>Event</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

            </thead>


            <tbody id="registrationBody">

            </tbody>

        </table>

    </div>

</div>


<footer>

    College Event Registration System © 2026

</footer>


<script>


    async function loadStudents() {

        const select =
            document.getElementById("studentId");


        try {

            const response =
                await fetch("/api/students");


            if (!response.ok) {

                throw new Error(
                    "Unable to load students"
                );

            }


            const students =
                await response.json();


            select.innerHTML =
                '<option value="">Select Student</option>';


            students.forEach(student => {

                const option =
                    document.createElement("option");


                option.value = student.id;


                option.textContent =
                    `${student.name} (${student.registerNumber})`;


                select.appendChild(option);

            });


        } catch (error) {

            select.innerHTML =
                '<option value="">Unable to load students</option>';

            console.error(error);

        }

    }



    async function loadEvents() {

        const select =
            document.getElementById("eventId");


        try {

            const response =
                await fetch("/api/events");


            if (!response.ok) {

                throw new Error(
                    "Unable to load events"
                );

            }


            const events =
                await response.json();


            select.innerHTML =
                '<option value="">Select Event</option>';


            events.forEach(event => {

                const option =
                    document.createElement("option");


                option.value = event.id;


                option.textContent =
                    `${event.name} - ${event.date}`;


                select.appendChild(option);

            });


        } catch (error) {

            select.innerHTML =
                '<option value="">Unable to load events</option>';

            console.error(error);

        }

    }



    async function loadRegistrations() {

        const body =
            document.getElementById(
                "registrationBody"
            );


        try {

            const response =
                await fetch(
                    "/api/registrations"
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load registrations"
                );

            }


            const registrations =
                await response.json();


            body.innerHTML = "";


            registrations.forEach(registration => {

                const row =
                    document.createElement("tr");


                const studentName =
                    registration.student?.name ??
                    registration.studentId ??
                    "";


                const eventName =
                    registration.event?.name ??
                    registration.eventId ??
                    "";


                let statusClass = "";


                if (
                    registration.status ===
                    "REGISTERED"
                ) {

                    statusClass = "registered";

                }


                if (
                    registration.status ===
                    "CANCELLED"
                ) {

                    statusClass = "cancelled";

                }


                row.innerHTML = `

                    <td>
                        ${registration.id ?? ""}
                    </td>

                    <td>
                        ${studentName}
                    </td>

                    <td>
                        ${eventName}
                    </td>

                    <td>
                        ${registration.registrationDate ?? ""}
                    </td>

                    <td class="${statusClass}">
                        ${registration.status ?? ""}
                    </td>

                    <td>

                        ${
                            registration.status === "REGISTERED"

                            ?

                            `<button
                                class="cancel-btn"
                                onclick="cancelRegistration(${registration.id})">

                                Cancel

                            </button>`

                            :

                            "-"
                        }

                    </td>

                `;


                body.appendChild(row);

            });


        } catch (error) {

            console.error(error);

        }

    }



    document
        .getElementById("registrationForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const studentId =
                    document.getElementById(
                        "studentId"
                    ).value;


                const eventId =
                    document.getElementById(
                        "eventId"
                    ).value;


                const message =
                    document.getElementById(
                        "message"
                    );


                try {

                    const response =
                        await fetch(
                            "/api/registrations",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    studentId:
                                        Number(studentId),

                                    eventId:
                                        Number(eventId)

                                })

                            }
                        );


                    const text =
                        await response.text();


                    let data;


                    try {

                        data =
                            JSON.parse(text);

                    } catch {

                        data = {
                            message: text
                        };

                    }


                    if (!response.ok) {

                        throw new Error(

                            data.message ||
                            "Registration failed"

                        );

                    }


                    message.style.display =
                        "block";

                    message.style.background =
                        "#e8f5e9";

                    message.style.color =
                        "#2e7d32";

                    message.innerText =
                        "Student registered successfully!";


                    document
                        .getElementById(
                            "registrationForm"
                        )
                        .reset();


                    loadRegistrations();


                } catch (error) {

                    message.style.display =
                        "block";

                    message.style.background =
                        "#ffebee";

                    message.style.color =
                        "#c62828";

                    message.innerText =
                        error.message;

                }

            }
        );



    async function cancelRegistration(id) {

        if (
            !confirm(
                "Are you sure you want to cancel this registration?"
            )
        ) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/registrations/${id}/cancel`,
                    {
                        method: "PUT"
                    }
                );


            const text =
                await response.text();


            if (!response.ok) {

                throw new Error(
                    text ||
                    "Unable to cancel registration"
                );

            }


            alert(
                "Registration cancelled successfully!"
            );


            loadRegistrations();


        } catch (error) {

            alert(
                error.message
            );

        }

    }



    loadStudents();

    loadEvents();

    loadRegistrations();


</script>

</body>

</html>
