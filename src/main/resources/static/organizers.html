<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Organizers - College Event Registration System</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 22px 50px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 94%;
            max-width: 1250px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar h2 {
            color: #1f4e79;
        }

        .back-btn {
            background: #555;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            overflow-x: auto;
        }

        .card h3 {
            color: #1f4e79;
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .main-btn {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #1f4e79;
            color: white;
            cursor: pointer;
        }

        .cancel-btn {
            display: none;
            margin-top: 15px;
            margin-left: 10px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #777;
            color: white;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: #1f4e79;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f8fc;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            padding: 10px;
            display: none;
            border-radius: 6px;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>
        College Event Registration System
    </h1>

</header>


<div class="container">


    <div class="top-bar">

        <h2>
            Organizer Management
        </h2>

        <a href="/" class="back-btn">
            ← Dashboard
        </a>

    </div>


    <!-- ADD / EDIT ORGANIZER -->

    <div class="card">

        <h3 id="formTitle">
            Add New Organizer
        </h3>


        <form id="organizerForm">

            <div class="form-grid">


                <input
                        type="text"
                        id="name"
                        placeholder="Organizer Name"
                        required
                >


                <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        required
                >


                <input
                        type="text"
                        id="phone"
                        placeholder="Phone Number"
                        required
                >


                <input
                        type="text"
                        id="department"
                        placeholder="Department"
                        required
                >


            </div>


            <button
                    type="submit"
                    class="main-btn"
                    id="submitBtn">

                Add Organizer

            </button>


            <button
                    type="button"
                    class="cancel-btn"
                    id="cancelEdit"
                    onclick="cancelEdit()">

                Cancel

            </button>


        </form>


        <div id="message"></div>

    </div>


    <!-- ORGANIZER LIST -->

    <div class="card">

        <h3>
            Organizer List
        </h3>


        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Actions</th>

            </tr>

            </thead>


            <tbody id="organizerBody">

            </tbody>

        </table>

    </div>

</div>


<script>


    let editingOrganizerId = null;



    async function loadOrganizers() {

        const body =
            document.getElementById(
                "organizerBody"
            );


        try {

            const response =
                await fetch(
                    "/api/organizers"
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load organizers"
                );

            }


            const organizers =
                await response.json();


            body.innerHTML = "";


            organizers.forEach(organizer => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${organizer.id ?? ""}
                    </td>

                    <td>
                        ${organizer.name ?? ""}
                    </td>

                    <td>
                        ${organizer.email ?? ""}
                    </td>

                    <td>
                        ${organizer.phone ?? ""}
                    </td>

                    <td>
                        ${organizer.department ?? ""}
                    </td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick='editOrganizer(${JSON.stringify(organizer)})'>

                            Edit

                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteOrganizer(${organizer.id})">

                            Delete

                        </button>

                    </td>

                `;


                body.appendChild(row);

            });


        } catch (error) {

            console.error(error);

        }

    }



    function editOrganizer(organizer) {

        editingOrganizerId =
            organizer.id;


        document.getElementById(
            "formTitle"
        ).innerText =
            "Edit Organizer";


        document.getElementById(
            "submitBtn"
        ).innerText =
            "Update Organizer";


        document.getElementById(
            "cancelEdit"
        ).style.display =
            "inline-block";


        document.getElementById(
            "name"
        ).value =
            organizer.name ?? "";


        document.getElementById(
            "email"
        ).value =
            organizer.email ?? "";


        document.getElementById(
            "phone"
        ).value =
            organizer.phone ?? "";


        document.getElementById(
            "department"
        ).value =
            organizer.department ?? "";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }



    function cancelEdit() {

        editingOrganizerId =
            null;


        document.getElementById(
            "organizerForm"
        ).reset();


        document.getElementById(
            "formTitle"
        ).innerText =
            "Add New Organizer";


        document.getElementById(
            "submitBtn"
        ).innerText =
            "Add Organizer";


        document.getElementById(
            "cancelEdit"
        ).style.display =
            "none";

    }



    async function deleteOrganizer(id) {

        if (
            !confirm(
                "Are you sure you want to delete this organizer?"
            )
        ) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/organizers/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const text =
                    await response.text();

                throw new Error(
                    text ||
                    "Unable to delete organizer"
                );

            }


            showMessage(
                "Organizer deleted successfully!",
                true
            );


            loadOrganizers();


        } catch (error) {

            showMessage(
                error.message,
                false
            );

        }

    }



    document
        .getElementById(
            "organizerForm"
        )
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const organizer = {

                    name:
                        document.getElementById(
                            "name"
                        ).value,

                    email:
                        document.getElementById(
                            "email"
                        ).value,

                    phone:
                        document.getElementById(
                            "phone"
                        ).value,

                    department:
                        document.getElementById(
                            "department"
                        ).value

                };


                try {

                    let response;


                    if (
                        editingOrganizerId === null
                    ) {

                        response =
                            await fetch(
                                "/api/organizers",
                                {

                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            organizer
                                        )

                                }
                            );


                    } else {

                        response =
                            await fetch(
                                `/api/organizers/${editingOrganizerId}`,
                                {

                                    method: "PUT",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            organizer
                                        )

                                }
                            );

                    }


                    const text =
                        await response.text();


                    if (!response.ok) {

                        throw new Error(
                            text ||
                            "Operation failed"
                        );

                    }


                    if (
                        editingOrganizerId === null
                    ) {

                        showMessage(
                            "Organizer added successfully!",
                            true
                        );

                    } else {

                        showMessage(
                            "Organizer updated successfully!",
                            true
                        );

                    }


                    cancelEdit();

                    loadOrganizers();


                } catch (error) {

                    showMessage(
                        error.message,
                        false
                    );

                }

            }
        );



    function showMessage(
        text,
        success
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.style.display =
            "block";


        if (success) {

            message.style.background =
                "#e8f5e9";

            message.style.color =
                "#2e7d32";

        } else {

            message.style.background =
                "#ffebee";

            message.style.color =
                "#c62828";

        }


        message.innerText =
            text;

    }



    loadOrganizers();

</script>

</body>

</html>
